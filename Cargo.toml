[package]
name = "ninja-work"
version = "1.0.0"
edition = "2021"
authors = ["Leonid Medovyy <leonid@macron1.io>"]
description = "A fast, keyboard-driven CLI and TUI workspace manager for Octopus AI agent harnesses"
readme = "README.md"
repository = "https://github.com/leouofa/ninja-work"
license = "MIT"
keywords = ["tui", "cli", "workspace", "octopus", "ratatui"]
categories = ["command-line-utilities"]

[lib]
name = "ninja_work"
path = "src/lib.rs"

[[bin]]
name = "work"
path = "src/bin/work.rs"

[[bin]]
name = "ninja-work"
path = "src/bin/ninja-work.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
unicode-width = "0.1"
arboard = "3"

[dev-dependencies]
tempfile = "3"
